<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Perros</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="header-container">
            <h1>Catálogo de Perros de al</h1>

            <p>
                Encuentra perros según su tamaño y temperamento
            </p>
        </div>
    </header>


    <main class="main-container">

        <!-- FILTROS -->
        <section class="search-panel">

            <h2>Buscar perros</h2>

            <p class="instructions">
                Selecciona el tamaño y el temperamento que deseas consultar.
            </p>


            <!-- TAMAÑO -->

            <div class="filter-group">

                <label for="sizeFilter">
                    Tamaño:
                </label>

                <select id="sizeFilter">

                    <option value="todos">
                        Todos
                    </option>

                    <option value="pequeño">
                        Pequeño
                    </option>

                    <option value="mediano">
                        Mediano
                    </option>

                    <option value="grande">
                        Grande
                    </option>

                </select>

            </div>


            <!-- TEMPERAMENTO -->

            <div class="filter-group">

                <label for="temperamentFilter">
                    Temperamento:
                </label>

                <select id="temperamentFilter">

                    <option value="todos">
                        Todos
                    </option>

                    <option value="affectionate">
                        Afectuoso
                    </option>

                    <option value="friendly">
                        Amigable
                    </option>

                    <option value="active">
                        Activo
                    </option>

                    <option value="agile">
                        Ágil
                    </option>

                    <option value="intelligent">
                        Inteligente
                    </option>

                    <option value="playful">
                        Juguetón
                    </option>

                    <option value="loyal">
                        Leal
                    </option>

                    <option value="protective">
                        Protector
                    </option>

                    <option value="calm">
                        Tranquilo
                    </option>

                    <option value="independent">
                        Independiente
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    id="btnSearch"
                    class="btn-submit">
                    🔎 Buscar perros
                </button>

                <button
                    type="button"
                    id="btnAll"
                    class="btn-secondary">
                    🐕 Mostrar todos
                </button>

            </div>

        </section>


        <!-- ESTADO -->

        <div
            id="statusContainer"
            class="status-box"
            style="display: none;">

            <p id="statusMessage">
                Consultando perros...
            </p>

        </div>


        <!-- RESULTADOS -->

        <section class="results-panel">

            <div class="results-header">

                <h2>
                    Razas disponibles
                </h2>

                <span
                    id="resultsCount"
                    class="results-counter">
                    0 perros
                </span>

            </div>


            <div
                id="resultsGrid"
                class="results-grid">

            </div>

        </section>

    </main>


    <!-- MODAL -->

    <dialog
        id="dogModal"
        class="detail-modal">

        <div class="modal-content">

            <button
                type="button"
                id="closeModalBtn"
                class="btn-close">

                ✕ Cerrar

            </button>


            <div class="modal-body">

                <img
                    id="modalImage"
                    src=""
                    alt="Perro">


                <h2 id="modalTitle">
                </h2>


                <div
                    id="modalInformation"
                    class="modal-information">
                </div>

            </div>

        </div>

    </dialog>


    <footer class="footer">

        <p>
            Catálogo de perros - Proyecto académico
        </p>

        <p>
            Información obtenida mediante The Dog API
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>
</html>
